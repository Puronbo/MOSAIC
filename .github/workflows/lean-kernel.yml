name: Lean kernel integration

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "mosaic/verification/lean_kernel.py"
      - "tests/test_lean_kernel.py"
      - ".github/workflows/lean-kernel.yml"
  pull_request:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "mosaic/verification/lean_kernel.py"
      - "tests/test_lean_kernel.py"
      - ".github/workflows/lean-kernel.yml"
  workflow_dispatch:

jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install and verify pinned Lean toolchain
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          cat > /tmp/MosaicOmegaProbe.lean <<'LEAN'
          import Lean
          theorem mosaic_omega_probe (x y : Nat) : x + y = y + x := by omega
          LEAN
          lean /tmp/MosaicOmegaProbe.lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MOSAIC
        run: python -m pip install -e .
      - name: Exercise real Lean kernel bridge
        run: |
          python - <<'PY'
          from mosaic.core.requests import MathRequest
          from mosaic.core.types import Operation
          from mosaic.verification.lean_kernel import verify_closed_nat_equality
          from mosaic.verification.lean_obligations import verify_request_identity_with_lean

          positive = verify_closed_nat_equality("(2 + 3) * 4", "20")
          assert positive.status == "FORMALLY_VERIFIED", positive.model_dump()
          negative = verify_closed_nat_equality("2 + 3", "6")
          assert negative.status == "REJECTED", negative.model_dump()
          request = MathRequest(
              operation=Operation.VERIFY_IDENTITY,
              expression="2 + 3",
              rhs="5",
          )
          bound = verify_request_identity_with_lean(request)
          assert bound.status == "FORMALLY_VERIFIED", bound.model_dump()
          assert bound.obligation.request_sha256
          assert bound.obligation.assumptions == ()
          print("Lean kernel bridge and request-bound obligation checks passed.")
          PY
