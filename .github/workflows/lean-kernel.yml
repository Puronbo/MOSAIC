name: Lean kernel integration

on:
  push:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "tests/test_lean_environment_pins.py"
      - "mosaic/verification/lean_kernel.py"
      - "mosaic/verification/lean_linear.py"
      - "mosaic/verification/lean_obligations.py"
      - "mosaic/verification/lean_transformations.py"
      - "tests/test_lean_kernel.py"
      - "tests/test_lean_linear.py"
      - "tests/test_lean_obligations.py"
      - "tests/test_lean_transformations.py"
      - ".github/workflows/lean-kernel.yml"
  pull_request:
    branches: [main]
    paths:
      - "lean-toolchain"
      - "mosaic/verification/lean_kernel.py"
      - "tests/test_lean_kernel.py"
      - ".github/workflows/lean-kernel.yml"
  workflow_dispatch:

jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install and verify pinned Lean toolchain
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          cat > /tmp/MosaicOmegaProbe.lean <<'LEAN'
          import Lean
          theorem mosaic_omega_probe (x y : Nat) : x + y = y + x := by omega
          LEAN
          lean /tmp/MosaicOmegaProbe.lean
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install MOSAIC from locked dependencies
        run: uv sync --locked
      - name: Exercise real Lean kernel bridge
        run: |
          uv run --locked python - <<'PY'
          from mosaic.core.requests import MathRequest
          from mosaic.core.types import Operation
          from mosaic.verification.lean_kernel import verify_closed_nat_equality
          from mosaic.verification.lean_linear import verify_linear_int_identity
          from mosaic.verification.lean_obligations import verify_request_identity_with_lean
          from mosaic.verification.lean_transformations import verify_request_transformation_with_lean

          positive = verify_closed_nat_equality("(2 + 3) * 4", "20")
          assert positive.status == "FORMALLY_VERIFIED", positive.model_dump()
          negative = verify_closed_nat_equality("2 + 3", "6")
          assert negative.status == "REJECTED", negative.model_dump()
          request = MathRequest(
              operation=Operation.VERIFY_IDENTITY,
              expression="2 + 3",
              rhs="5",
          )
          bound = verify_request_identity_with_lean(request)
          assert bound.status == "FORMALLY_VERIFIED", bound.model_dump()
          assert bound.obligation.request_sha256
          assert bound.obligation.assumptions == ()
          symbolic = verify_linear_int_identity("x + y", "y + x")
          assert symbolic.status == "FORMALLY_VERIFIED", symbolic.model_dump()
          assert symbolic.variables == ("x", "y")
          symbolic_negative = verify_linear_int_identity("x + y", "x + z")
          assert symbolic_negative.status == "REJECTED", symbolic_negative.model_dump()
          symbolic_request = MathRequest(
              operation=Operation.VERIFY_IDENTITY,
              expression="x + y",
              rhs="y + x",
          )
          symbolic_bound = verify_request_identity_with_lean(symbolic_request)
          assert symbolic_bound.status == "FORMALLY_VERIFIED", symbolic_bound.model_dump()
          assert symbolic_bound.obligation.checker_id == "lean.kernel.linear_int_identity.v1"
          assert symbolic_bound.obligation.variables == ("x", "y")
          transform_request = MathRequest(
              operation=Operation.SIMPLIFY,
              expression="2*x + x",
          )
          transformed = verify_request_transformation_with_lean(transform_request, "3*x")
          assert transformed.status == "FORMALLY_VERIFIED", transformed.model_dump()
          assert transformed.obligation.operation == "simplify"
          assert transformed.obligation.variables == ("x",)
          print("Closed, symbolic, and request-bound transformation Lean checks passed.")
          PY
