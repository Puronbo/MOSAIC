name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python tests
        run: uv run --locked python -m pytest -q --ignore=tests/test_lean_derivation_integration.py
      - name: Run independent Node receipt tests
        run: node --test tests/test_verify_lean_receipt.mjs
      - name: Set up pinned Lean and Mathlib
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/polynomial
          build: true
          use-mathlib-cache: true
      - name: Run real Lean derivation integration test
        run: uv run --locked python -m pytest -q tests/test_lean_derivation_integration.py
