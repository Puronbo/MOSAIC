name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python tests
        run: uv run --locked python -m pytest -q
      - name: Run independent Node receipt tests
        run: node --test tests/test_verify_lean_receipt.mjs
