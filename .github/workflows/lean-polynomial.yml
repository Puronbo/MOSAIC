name: Lean polynomial integration

on:
  push:
    branches: [main]
    paths:
      - "formal/polynomial/**"
      - "mosaic/verification/lean_polynomial.py"
      - "mosaic/verification/lean_calculus.py"
      - "mosaic/verification/lean_obligations.py"
      - "mosaic/verification/lean_transformations.py"
      - "mosaic/core/model_gateway.py"
      - "mosaic/core/tool_schema.py"
      - "mosaic/engines/algebra.py"
      - "tests/test_algebra.py"
      - "tests/test_model_gateway.py"
      - "tests/test_lean_calculus.py"
      - "mosaic/api.py"
      - "tests/test_lean_polynomial.py"
      - "tests/test_lean_obligations.py"
      - ".github/workflows/lean-polynomial.yml"
  pull_request:
    branches: [main]
    paths:
      - "formal/polynomial/**"
      - "mosaic/verification/lean_polynomial.py"
      - "mosaic/verification/lean_calculus.py"
      - "mosaic/verification/lean_obligations.py"
      - "mosaic/verification/lean_transformations.py"
      - "mosaic/api.py"
      - "tests/test_lean_calculus.py"
      - "tests/test_lean_polynomial.py"
      - "tests/test_lean_obligations.py"
      - "tests/test_lean_transformations.py"
      - "tests/test_lean_polynomial_api.py"
      - ".github/workflows/lean-polynomial.yml"
  workflow_dispatch:

jobs:
  polynomial-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean and Mathlib dependencies
        working-directory: formal/polynomial
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake --version
          lake exe cache get
      - name: Check polynomial identities with real Lean kernel
        working-directory: formal/polynomial
        run: lake env lean Main.lean
      - name: Install MOSAIC
        run: python -m pip install -e ".[dev]"
      - name: Exercise bounded polynomial and derivative proofs with real Lean kernel
        run: |
          python - <<'PY'
          from mosaic.core.requests import MathRequest
          from mosaic.core.types import Operation
          from mosaic.verification.lean_polynomial import verify_polynomial_int_identity
          from mosaic.verification.lean_calculus import verify_polynomial_real_derivative
          from mosaic.verification.lean_obligations import verify_request_identity_with_lean
          from mosaic.verification.lean_transformations import verify_request_transformation_with_lean
          from mosaic.core.model_gateway import ModelCandidateSubmission, evaluate_model_candidate
          import json

          positive = verify_polynomial_int_identity("(x + 1)**2", "x**2 + 2*x + 1")
          assert positive.status == "FORMALLY_VERIFIED", positive.model_dump()
          assert positive.variables == ("x",)
          assert positive.proof_source_sha256
          second = verify_polynomial_int_identity("(x + y)*(x - y)", "x^2 - y^2")
          assert second.status == "FORMALLY_VERIFIED", second.model_dump()
          negative = verify_polynomial_int_identity("x^2 + 1", "x^2 + 2")
          assert negative.status == "REJECTED", negative.model_dump()
          unsupported = verify_polynomial_int_identity("x / 2", "x")
          assert unsupported.status == "UNSUPPORTED", unsupported.model_dump()

          derivative = verify_polynomial_real_derivative("(x + 1)^3")
          assert derivative.status == "FORMALLY_VERIFIED", derivative.model_dump()
          assert derivative.proof_source_sha256
          product_derivative = verify_polynomial_real_derivative("(x + 2) * (x - 3)")
          assert product_derivative.status == "FORMALLY_VERIFIED", product_derivative.model_dump()
          bad_derivative = verify_polynomial_real_derivative("sin(x)")
          assert bad_derivative.status == "UNSUPPORTED", bad_derivative.model_dump()

          request = MathRequest(
              operation=Operation.VERIFY_IDENTITY,
              expression="(x + 1)**2",
              rhs="x**2 + 2*x + 1",
          )
          bound = verify_request_identity_with_lean(request)
          assert bound.status == "FORMALLY_VERIFIED", bound.model_dump()
          assert bound.obligation.checker_id == "lean.kernel.polynomial_int_identity.v1"
          assert bound.obligation.request_sha256
          assert bound.obligation.variables == ("x",)
          assert bound.obligation.assumptions == ()

          transform_request = MathRequest(
              operation=Operation.EXPAND,
              expression="(x + 1)**2",
          )
          transformed = verify_request_transformation_with_lean(
              transform_request, "x**2 + 2*x + 1"
          )
          assert transformed.status == "FORMALLY_VERIFIED", transformed.model_dump()
          assert transformed.obligation.checker_id == "lean.kernel.polynomial_int_identity.v1"
          assert transformed.obligation.request_sha256
          assert transformed.obligation.candidate_sha256
          gateway_identity = evaluate_model_candidate(ModelCandidateSubmission(
              request=request,
              candidate=json.dumps({
                  "operation": "verify_identity",
                  "expression": "(x + 1)**2",
                  "rhs": "x**2 + 2*x + 1",
              }),
              provider_id="ci-provider",
              model_id="ci-model",
          ))
          assert gateway_identity.status == "FORMALLY_VERIFIED", gateway_identity.model_dump()
          assert gateway_identity.provider_id == "ci-provider"

          gateway_transform = evaluate_model_candidate(ModelCandidateSubmission(
              request=transform_request,
              candidate=json.dumps({
                  "operation": "expand",
                  "expression": "(x + 1)**2",
                  "variable": "x",
                  "result": "x**2 + 2*x + 1",
              }),
          ))
          assert gateway_transform.status == "FORMALLY_VERIFIED", gateway_transform.model_dump()
          print("Polynomial identities, real polynomial derivatives, request-bound proofs, and model gateway checks passed.")
          PY
