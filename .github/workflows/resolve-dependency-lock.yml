name: resolve-dependency-lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/resolve-dependency-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
      - name: Resolve and validate lock
        run: |
          uv lock --python 3.11
          uv lock --check
          sha256sum uv.lock
      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "Update pinned Python dependency lock"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
