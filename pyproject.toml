[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-math"
version = "0.1.0"
description = "A typed, verifiable framework for mathematical reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mosaic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
